global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

alerting:
  alertmanagers: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector (exposes Prometheus metrics at :8889)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # ForgeBoard web app (if exposing /metrics via prom-client)
  - job_name: 'forgeboard'
    static_configs:
      - targets: ['web:3000']
    metrics_path: /api/metrics
    scrape_interval: 30s
